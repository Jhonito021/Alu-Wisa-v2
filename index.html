<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alu WISA - DevisTrack Express</title>

    <!-- PWA Configuration -->
    <meta name="theme-color" content="#1e3378" />
    <meta name="description" content="Calculateur de devis et gestion de commandes pour menuiserie aluminium Alu WISA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/img/LogoAluWisa.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Mobile & PWA App Features -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevisTrack" />

    <!-- CSS -->
    <link rel="stylesheet" href="/bootstrap-4.0.0-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/bootstrap-4.0.0-dist/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker enregistré avec succès:', reg.scope))
            .catch((err) => console.error('Échec enregistrement Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
